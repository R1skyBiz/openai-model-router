[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-model-router"
version = "0.1.0"
description = "Configuration-driven routing for OpenAI models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "openai>=2.54,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "live_openai: explicitly opted-in paid OpenAI checks (skipped by default)",
]

[tool.uv]
package = true
